name: gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to an open PR emits both push and pull_request events. Use the
  # shared head branch name so the newer automatic run cancels the duplicate
  # cold build. Keep manual size runs isolated from automatic validation.
  group: gate-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows validate
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-validate
          cache-on-failure: true

      - name: Guard unamended frozen core crates
        shell: pwsh
        run: |
          $defaultBranch = "${{ github.event.repository.default_branch }}"
          git fetch --no-tags origin $defaultBranch

          if ("${{ github.event_name }}" -eq "pull_request") {
            $baseCandidate = "${{ github.event.pull_request.base.sha }}"
          } elseif (
            "${{ github.event_name }}" -eq "push" -and
            "${{ github.ref_name }}" -eq $defaultBranch -and
            "${{ github.event.before }}" -notmatch "^0+$"
          ) {
            $baseCandidate = "${{ github.event.before }}"
          } else {
            $baseCandidate = "origin/$defaultBranch"
          }

          $mergeBase = (git merge-base HEAD $baseCandidate).Trim()
          if ([string]::IsNullOrWhiteSpace($mergeBase)) {
            throw "Unable to resolve a merge-base for the frozen-core guard."
          }

          # All six trust anchors below are frozen. PR #9 was the sole publicly
          # reviewed, append-only amendment to crates/types and crates/state-store;
          # no schema exception remains active.
          Write-Host "Unamended frozen-core comparison base: $mergeBase"
          git diff --name-only $mergeBase HEAD -- `
            crates/types `
            crates/observability `
            crates/state-store `
            crates/solana-core `
            crates/wallet-engine `
            crates/risk-engine
          git diff --exit-code $mergeBase HEAD -- `
            crates/types `
            crates/observability `
            crates/state-store `
            crates/solana-core `
            crates/wallet-engine `
            crates/risk-engine
          if ($LASTEXITCODE -ne 0) {
            throw "Unamended frozen core crate changes are not allowed in this PR."
          }

      - name: Check formatting outside the legacy baseline
        # These six crates predate this repo's rustfmt baseline. This exclusion
        # is independent of the temporary PR #9 frozen-diff exception.
        shell: pwsh
        run: |
          $legacyFmtExcludedPackages = @(
            "claw-types",
            "claw-observability",
            "claw-state-store",
            "claw-solana-core",
            "claw-wallet-engine",
            "claw-risk-engine"
          )

          $metadata = cargo metadata --format-version 1 --no-deps |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed."
          }

          $workspaceIds = @($metadata.workspace_members)
          $workspacePackages = @(
            $metadata.packages |
              Where-Object { $_.id -in $workspaceIds }
          )
          $presentLegacyFmtExcluded = @(
            $workspacePackages |
              Where-Object { $_.name -in $legacyFmtExcludedPackages }
          )
          if ($presentLegacyFmtExcluded.Count -ne $legacyFmtExcludedPackages.Count) {
            throw "Legacy fmt exclusion list no longer matches the workspace."
          }

          $mutablePackages = @(
            $workspacePackages |
              Where-Object { $_.name -notin $legacyFmtExcludedPackages } |
              Sort-Object name
          )
          if ($mutablePackages.Count -eq 0) {
            throw "No non-frozen workspace packages found."
          }

          $fmtArgs = @("fmt", "--check")
          foreach ($package in $mutablePackages) {
            $fmtArgs += @("-p", $package.name)
          }

          Write-Host "cargo $($fmtArgs -join ' ')"
          & cargo @fmtArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Formatting check failed."
          }

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

  release-artifact:
    name: Windows release artifact
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache release build inputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release

      - name: Report release size and checksum
        shell: pwsh
        run: |
          $binary = Get-Item -LiteralPath target/release/solfrontier-mcp.exe
          $checksum = Get-FileHash -LiteralPath $binary.FullName -Algorithm SHA256
          Write-Host "Release binary bytes: $($binary.Length)"
          Write-Host "Release binary SHA-256: $($checksum.Hash)"

          $summary = @(
            "## Windows release artifact",
            "",
            "| Field | Value |",
            "| --- | --- |",
            "| Bytes | $($binary.Length) |",
            "| SHA-256 | $($checksum.Hash) |",
            "| Run ID | ${{ github.run_id }} |"
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary -Encoding utf8

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: solfrontier-mcp-windows-${{ github.sha }}
          path: target/release/solfrontier-mcp.exe
          if-no-files-found: error
          retention-days: 14
